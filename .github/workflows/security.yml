name: security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: secret scan (tree + history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Secret + PII scan (working tree and full git history)
        run: python scripts/secret-scan.py

  guards:
    name: prompt guards present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Guard phrases still in the skill prompts
        run: python scripts/skill-guards.py

  auditor:
    name: eval auditor self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Auditor passes honesty and still catches sabotage
        run: python scripts/eval-selftest.py

  semgrep:
    name: semgrep (secrets + security-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install semgrep
        run: pip install semgrep
      - name: Scan
        run: semgrep scan --config p/secrets --config p/security-audit --metrics=off --error .
