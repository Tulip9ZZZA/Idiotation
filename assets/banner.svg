<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" role="img" aria-label="Idiotation kill-chain banner: five gates, one survivor">
  <!-- Idiotation hero banner - dark tile works on GitHub light and dark themes -->
  <rect width="1200" height="240" rx="18" fill="#101828"/>

  <!-- main mark (exact copy of logo-mark.svg shapes, 64-space, scaled 2.1) -->
  <g transform="translate(55.2,35.2) scale(2.1)">
    <g fill="#FFFFFF">
      <rect x="8" y="8" width="48" height="10" rx="3"/>
      <rect x="8" y="20" width="10" height="36" rx="3"/>
      <rect x="46" y="20" width="10" height="36" rx="3"/>
    </g>
    <path fill="#A78BFA" d="M32 26 Q33.8 36.4 42 39 Q33.8 41.6 32 52 Q30.2 41.6 22 39 Q30.2 36.4 32 26 Z"/>
  </g>

  <!-- five gates, one survivor -->
  <g fill="none" stroke="#94A3B8" stroke-width="5" stroke-linecap="round">
    <path d="M232 78 H288 M238 84 V156 M282 84 V156"/>
    <path d="M342 78 H398 M348 84 V156 M392 84 V156"/>
    <path d="M452 78 H508 M458 84 V156 M502 84 V156"/>
    <path d="M562 78 H618 M568 84 V156 M612 84 V156"/>
    <path d="M672 78 H728 M678 84 V156 M722 84 V156"/>
  </g>
  <!-- gate labels -->
  <g fill="#94A3B8" font-family="ui-sans-serif,-apple-system,'Segoe UI',Arial,sans-serif"
     font-size="20" font-weight="700" letter-spacing="2" text-anchor="middle">
    <text x="260" y="192">RECON</text>
    <text x="370" y="192">FORGE</text>
    <text x="480" y="192">KILL</text>
    <text x="590" y="192">ROAST</text>
    <text x="700" y="192">LOCK</text>
  </g>
  <!-- arrows between gates: shaft + clean triangular head -->
  <g stroke="#475569" stroke-width="4" stroke-linecap="round">
    <path d="M298 117 H314"/>
    <path d="M408 117 H424"/>
    <path d="M518 117 H534"/>
    <path d="M628 117 H644"/>
  </g>
  <g fill="#475569">
    <path d="M314 109 L328 117 L314 125 Z"/>
    <path d="M424 109 L438 117 L424 125 Z"/>
    <path d="M534 109 L548 117 L534 125 Z"/>
    <path d="M644 109 L658 117 L644 125 Z"/>
  </g>
  <!-- funnel into the survivor -->
  <g stroke="#475569" stroke-width="3" fill="none">
    <path d="M740 90 C800 90 810 118 846 118"/>
    <path d="M740 144 C800 144 810 122 846 122"/>
  </g>
  <!-- survivor tile -->
  <rect x="856" y="86" width="72" height="72" rx="14" fill="#1D2939" stroke="#7C3AED" stroke-width="2"/>
  <path fill="#A78BFA" d="M892 100 Q893.7 111.4 903 116 Q893.7 120.6 892 132 Q890.3 120.6 881 116 Q890.3 111.4 892 100 Z"/>

  <!-- out arrow -->
  <path d="M944 122 H984" stroke="#7C3AED" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M984 114 L998 122 L984 130 Z" fill="#7C3AED"/>

  <!-- tagline -->
  <g fill="#E4E7EC" font-family="ui-sans-serif,-apple-system,'Segoe UI',Arial,sans-serif">
    <text x="1010" y="110" font-size="22" font-weight="700" letter-spacing="1">NOTHING</text>
    <text x="1010" y="134" font-size="22" font-weight="700" letter-spacing="1">SURVIVES</text>
    <text x="1010" y="158" font-size="22" font-weight="700" letter-spacing="1" fill="#A78BFA">BY DEFAULT</text>
  </g>
</svg>
