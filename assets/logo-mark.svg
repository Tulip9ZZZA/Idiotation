<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Idiotation mark: a spark passing through an open gate">
  <!-- Idiotation mark - "the spark survives the gate"
       Gate = the kill-chain (evidence, forge, kill, roast, lock)
       Spark = the idea that made it through
       One-colour safe: all shapes read as a single silhouette when flattened -->
  <g fill="#101828">
    <!-- lintel -->
    <rect x="8" y="8" width="48" height="10" rx="3"/>
    <!-- left pillar -->
    <rect x="8" y="20" width="10" height="36" rx="3"/>
    <!-- right pillar -->
    <rect x="46" y="20" width="10" height="36" rx="3"/>
  </g>
  <path fill="#7C3AED" d="M32 26 Q33.8 36.4 42 39 Q33.8 41.6 32 52 Q30.2 41.6 22 39 Q30.2 36.4 32 26 Z"/>
</svg>
